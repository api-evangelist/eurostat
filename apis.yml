apis:
- name: Eurostat Statistics API
  description: >-
    The primary REST API for accessing Eurostat datasets in JSON-stat 2.0 format. Supports filtering by
    geography, time period, and any dataset dimension. Returns synchronous or asynchronous responses depending
    on query size.
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
