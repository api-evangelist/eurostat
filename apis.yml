- name: Eurostat SDMX 3.0 API
  description: >-
    SDMX 3.0-compliant web service providing access to Eurostat datasets, dataflows, data structure definitions,
    and codelists. Supports SDMX-ML 3.0 and 2.1, SDMX-CSV 2.0 and 1.0, TSV, and JSON-stat formats.
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
