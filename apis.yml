- name: Eurostat Asynchronous API
  description: >-
    Asynchronous dissemination API for large dataset extractions between 500,000 and 5,000,000 cells.
    Clients submit a request, receive a unique key, poll for status, and download results when available.
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
